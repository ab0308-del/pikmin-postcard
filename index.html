<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌿 皮克敏明信片製作</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #e8f5e9 0%, #f9fbe7 60%, #fff8e1 100%);
      min-height: 100vh;
      color: #2e2e2e;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(90deg, #2e7d32, #558b2f);
      color: white;
      text-align: center;
      padding: 18px 20px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    header h1 { font-size: clamp(1.3em, 4vw, 2em); letter-spacing: .02em; }
    header p  { opacity: .85; margin-top: 4px; font-size: .95em; }

    /* ── Progress bar ── */
    .progress-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding: 16px 0 8px;
    }
    .pdot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #c8e6c9;
      transition: background .3s, transform .2s;
    }
    .pdot.done    { background: #4caf50; }
    .pdot.current { background: #81c784; animation: pulse .9s infinite; }
    .pline {
      width: 32px; height: 3px;
      background: #c8e6c9;
      border-radius: 2px;
      transition: background .3s;
    }
    .pline.done { background: #4caf50; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }

    /* ── Layout ── */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 16px 40px;
    }

    /* ── Steps ── */
    .step { display: none; }
    .step.active { display: block; animation: fadeUp .4s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }

    .step-title {
      font-size: 1.35em;
      font-weight: 700;
      color: #2e7d32;
      margin: 18px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-badge {
      background: #4caf50;
      color: white;
      min-width: 34px; height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: .95em;
      flex-shrink: 0;
    }

    /* ── Frame grid ── */
    .frame-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .frame-card {
      background: white;
      border: 4px solid transparent;
      border-radius: 16px;
      padding: 8px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }
    .frame-card:hover  { transform: translateY(-5px); box-shadow: 0 10px 28px rgba(0,0,0,.18); }
    .frame-card.selected {
      border-color: #4caf50;
      box-shadow: 0 0 0 4px rgba(76,175,80,.25), 0 6px 20px rgba(0,0,0,.15);
    }
    .frame-card img  { width: 100%; border-radius: 8px; display: block; }
    .frame-card .fn {
      text-align: center;
      padding: 8px 0 3px;
      font-weight: 700;
      color: #2e7d32;
      font-size: .95em;
    }

    /* ── Camera section ── */
    .selected-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border-radius: 14px;
      padding: 10px 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      margin-bottom: 16px;
    }
    .selected-badge img { width: 72px; border-radius: 6px; }
    .selected-badge .name { font-weight: 700; color: #2e7d32; }
    .selected-badge .sub  { font-size: .82em; color: #888; }

    .camera-wrap {
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      max-width: 620px;
      margin: 0 auto;
      position: relative;
    }
    #video {
      width: 100%;
      display: block;
      transform: scaleX(-1); /* mirror preview */
    }
    .camera-hint {
      position: absolute;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.55);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: .82em;
      pointer-events: none;
    }
    .no-cam-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #888;
      font-size: 1em;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 13px 26px;
      border: none;
      border-radius: 50px;
      font-size: 1em;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, opacity .2s;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
    .btn:not(:disabled):hover { transform: translateY(-2px); }

    .btn-green {
      background: linear-gradient(135deg, #4caf50, #2e7d32);
      color: white;
      box-shadow: 0 4px 14px rgba(76,175,80,.4);
    }
    .btn-green:not(:disabled):hover { box-shadow: 0 6px 20px rgba(76,175,80,.55); }

    .btn-outline {
      background: white;
      color: #2e7d32;
      border: 2px solid #4caf50;
    }

    .btn-orange {
      background: linear-gradient(135deg, #ff9800, #e65100);
      color: white;
      box-shadow: 0 4px 14px rgba(255,152,0,.4);
    }
    .btn-orange:not(:disabled):hover { box-shadow: 0 6px 20px rgba(255,152,0,.55); }

    #fileInput { display: none; }

    /* ── Processing ── */
    .processing-wrap {
      text-align: center;
      padding: 70px 20px;
    }
    .spinner {
      width: 64px; height: 64px;
      border: 7px solid #e8f5e9;
      border-top-color: #4caf50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .proc-title { font-size: 1.4em; font-weight: 700; color: #2e7d32; }
    .proc-sub   { color: #888; margin-top: 8px; }
    .proc-note  { color: #aaa; font-size: .85em; margin-top: 18px; }

    /* ── Result ── */
    .result-img-wrap {
      text-align: center;
      margin: 10px 0 20px;
    }
    #resultCanvas {
      max-width: 100%;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.22);
    }

    /* ── QR box ── */
    .qr-box {
      display: none;
      text-align: center;
      background: white;
      border-radius: 18px;
      padding: 28px 24px;
      max-width: 290px;
      margin: 20px auto 0;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }
    .qr-box.show { display: block; animation: fadeUp .3s ease; }
    .qr-title { font-weight: 700; color: #2e7d32; font-size: 1.05em; }
    #qrcode { margin: 14px auto; }
    .qr-hint { font-size: .82em; color: #999; margin-top: 8px; }

    /* ── Alert / info ── */
    .info-box {
      display: none;
      background: #fff9c4;
      border: 1px solid #f9a825;
      border-radius: 12px;
      padding: 14px 18px;
      margin: 16px 0;
      font-size: .93em;
      line-height: 1.5;
    }
    .info-box.show { display: block; }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 24px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .frame-grid { gap: 8px; }
      .btn { padding: 12px 18px; font-size: .92em; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌿 皮克敏明信片製作 🌿</h1>
  <p>選外框 → 拍照 → AI 去背合成 → 下載帶回家！</p>
</header>

<div class="container">

  <!-- Progress dots -->
  <div class="progress-bar">
    <div class="pdot current" id="pd1"></div>
    <div class="pline"  id="pl1"></div>
    <div class="pdot"   id="pd2"></div>
    <div class="pline"  id="pl2"></div>
    <div class="pdot"   id="pd3"></div>
    <div class="pline"  id="pl3"></div>
    <div class="pdot"   id="pd4"></div>
  </div>

  <!-- ── Step 1：選外框 ── -->
  <div class="step active" id="step1">
    <div class="step-title">
      <div class="step-badge">1</div> 選擇你喜歡的外框
    </div>

    <div class="frame-grid">
      <div class="frame-card" id="fc0" onclick="selectFrame(0)">
        <img src="frames/frame1.png" alt="春日草地">
        <div class="fn">🍄 春日草地</div>
      </div>
      <div class="frame-card" id="fc1" onclick="selectFrame(1)">
        <img src="frames/frame2.png" alt="洋蔥飛船">
        <div class="fn">🌸 洋蔥飛船</div>
      </div>
      <div class="frame-card" id="fc2" onclick="selectFrame(2)">
        <img src="frames/frame3.png" alt="秋日森林">
        <div class="fn">🍂 秋日森林</div>
      </div>
    </div>

    <div class="btn-row" style="margin-top:28px;">
      <button class="btn btn-green" id="toStep2Btn" onclick="goToStep2()" disabled>
        📷 下一步：拍照
      </button>
    </div>
  </div>

  <!-- ── Step 2：拍照 ── -->
  <div class="step" id="step2">

    <div class="selected-badge">
      <img id="selThumb" src="" alt="">
      <div>
        <div class="name" id="selName"></div>
        <div class="sub">已選擇此外框</div>
      </div>
      <button class="btn btn-outline" style="margin-left:auto;padding:8px 14px;font-size:.88em" onclick="goToStep1()">
        更換
      </button>
    </div>

    <div class="step-title">
      <div class="step-badge">2</div> 拍照或上傳照片
    </div>

    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-hint">對準鏡頭，點「拍照」</div>
    </div>
    <div class="no-cam-msg" id="noCamMsg">
      📷 無法開啟相機，請直接上傳照片
    </div>

    <canvas id="captureCanvas" style="display:none"></canvas>

    <div class="btn-row">
      <button class="btn btn-green" id="captureBtn" onclick="capturePhoto()">📸 拍照</button>
      <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()">
        🖼 上傳照片
      </button>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
    </div>

    <p style="text-align:center;color:#999;font-size:.85em;margin-top:10px;">
      支援手機拍照上傳（JPG、PNG）
    </p>
  </div>

  <!-- ── Step 3：處理中 ── -->
  <div class="step" id="step3">
    <div class="processing-wrap">
      <div class="spinner"></div>
      <div class="proc-title" id="procMsg">正在 AI 去背中…</div>
      <div class="proc-sub">請稍等，AI 正在幫你移除照片背景</div>
      <div class="proc-note" id="procNote">首次使用需下載 AI 模型，約需 30–90 秒</div>
    </div>
  </div>

  <!-- ── Step 4：成果 ── -->
  <div class="step" id="step4">
    <div class="step-title">
      <div class="step-badge">✓</div> 你的皮克敏明信片完成了！
    </div>

    <div class="result-img-wrap">
      <canvas id="resultCanvas"></canvas>
    </div>

    <div class="btn-row">
      <button class="btn btn-green" onclick="downloadImage()">⬇️ 立即下載</button>
      <button class="btn btn-orange" id="qrBtn" onclick="generateQR()">📱 產生 QR Code 帶回家</button>
      <button class="btn btn-outline" onclick="startOver()">🔄 再做一張</button>
    </div>

    <div class="info-box" id="noQrBox">
      ⚠️ <strong>QR Code 功能尚未設定</strong>：請聯絡活動負責老師，或直接使用「立即下載」按鈕將圖片存到你的裝置。
    </div>

    <div class="qr-box" id="qrBox">
      <div class="qr-title">📱 用手機掃描帶走！</div>
      <div id="qrcode"></div>
      <div class="qr-hint">⏰ 連結 24 小時後失效，請盡快掃描下載</div>
    </div>
  </div>

</div><!-- /container -->

<!-- QRCode library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script type="module">
/* ════════════════════════════════════════════════
   設定區 — 老師請在這裡填入 imgbb API Key
   申請免費 Key：https://api.imgbb.com/
   ════════════════════════════════════════════════ */
const IMGBB_API_KEY = '968d1c8713e41c9ab2654f2d2c19f8e9';
const QR_EXPIRY_SEC = 86400; // QR Code 有效秒數（預設 24 小時）

/* ── 外框資料 ── */
const FRAMES = [
  { name: '🍄 春日草地', src: 'frames/frame1.png' },
  { name: '🌸 洋蔥飛船', src: 'frames/frame2.png' },
  { name: '🍂 秋日森林', src: 'frames/frame3.png' },
];

/* ── 狀態 ── */
let selectedIdx  = null;
let photoBlob    = null;
let cameraStream = null;
let resultCanvas = null;
let qrDone       = false;

/* ════════════════════════════════════════════════
   Step 1 — 選外框
   ════════════════════════════════════════════════ */
window.selectFrame = function(idx) {
  selectedIdx = idx;
  document.querySelectorAll('.frame-card').forEach((c, i) =>
    c.classList.toggle('selected', i === idx)
  );
  document.getElementById('toStep2Btn').disabled = false;
};

window.goToStep1 = function() {
  stopCamera();
  showStep(1);
};

/* ════════════════════════════════════════════════
   Step 2 — 相機
   ════════════════════════════════════════════════ */
window.goToStep2 = async function() {
  const f = FRAMES[selectedIdx];
  document.getElementById('selThumb').src = f.src;
  document.getElementById('selName').textContent  = f.name;
  showStep(2);
  await startCamera();
};

async function startCamera() {
  const video   = document.getElementById('video');
  const wrap    = document.getElementById('cameraWrap');
  const noMsg   = document.getElementById('noCamMsg');
  const capBtn  = document.getElementById('captureBtn');

  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = cameraStream;
    wrap.style.display = 'block';
    noMsg.style.display = 'none';
    capBtn.disabled = false;
  } catch {
    wrap.style.display = 'none';
    noMsg.style.display = 'block';
    capBtn.disabled = true;
  }
}

function stopCamera() {
  cameraStream?.getTracks().forEach(t => t.stop());
  cameraStream = null;
}

window.capturePhoto = function() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('captureCanvas');
  const w = video.videoWidth, h = video.videoHeight;

  canvas.width  = w;
  canvas.height = h;

  const ctx = canvas.getContext('2d');
  // mirror to match preview
  ctx.translate(w, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, w, h);

  stopCamera();
  canvas.toBlob(blob => {
    photoBlob = blob;
    processPhoto();
  }, 'image/jpeg', 0.95);
};

window.handleFile = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  photoBlob = file;
  stopCamera();
  processPhoto();
};

/* ════════════════════════════════════════════════
   Step 3 — AI 去背 + 合成
   ════════════════════════════════════════════════ */
async function processPhoto() {
  showStep(3);

  try {
    setProc('正在載入 AI 模型…', '首次使用需下載模型（約 30–90 秒），之後會更快');

    // dynamic import so it doesn't block initial load
    const { removeBackground } = await import(
      'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/browser.mjs'
    );

    setProc('AI 去背處理中…', '正在移除照片背景，請稍候');

    const personBlob = await removeBackground(photoBlob, {
      publicPath: 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/',
      model: 'small',
      output: { type: 'foreground', format: 'image/png' },
    });

    setProc('合成外框中…', '');

    resultCanvas = await composite(personBlob);

    // copy to display canvas
    const display = document.getElementById('resultCanvas');
    display.width  = resultCanvas.width;
    display.height = resultCanvas.height;
    display.getContext('2d').drawImage(resultCanvas, 0, 0);

    showStep(4);
  } catch (err) {
    console.error(err);
    alert('處理失敗：' + err.message + '\n\n請重新整理頁面再試一次。');
    showStep(2);
    await startCamera();
  }
}

function setProc(title, note) {
  document.getElementById('procMsg').textContent  = title;
  document.getElementById('procNote').textContent = note;
}

/* ── Canvas 合成 ──
   順序：白底 → 人像（去背）→ 外框 multiply
   外框白色區域 × 人像顏色 = 人像顏色（白色 = 乘法中性元素）
   外框彩色邊框 × 白底 = 彩色邊框                             */
async function composite(personBlob) {
  const frameImg  = await loadImg(FRAMES[selectedIdx].src);
  const personUrl = URL.createObjectURL(personBlob);
  const personImg = await loadImg(personUrl);
  URL.revokeObjectURL(personUrl);

  const W = frameImg.naturalWidth;
  const H = frameImg.naturalHeight;

  const canvas = document.createElement('canvas');
  canvas.width  = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // 1. 白色底板
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // 2. 計算人像大小：最大佔畫面中央 68% 寬、78% 高，底部對齊
  const maxW  = W * 0.68;
  const maxH  = H * 0.78;
  const scale = Math.min(maxW / personImg.naturalWidth, maxH / personImg.naturalHeight);
  const pW    = personImg.naturalWidth  * scale;
  const pH    = personImg.naturalHeight * scale;
  const pX    = (W - pW) / 2;
  const pY    = H - pH - H * 0.04; // 靠底部，留小間距

  ctx.drawImage(personImg, pX, pY, pW, pH);

  // 3. 外框疊加（multiply）：讓外框白色中心區透明
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(frameImg, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  return canvas;
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}

/* ════════════════════════════════════════════════
   Step 4 — 下載 & QR Code
   ════════════════════════════════════════════════ */
window.downloadImage = function() {
  const a = document.createElement('a');
  a.download = '皮克敏明信片.png';
  a.href = resultCanvas.toDataURL('image/png');
  a.click();
};

window.generateQR = async function() {
  if (qrDone) {
    document.getElementById('qrBox').classList.toggle('show');
    return;
  }

  if (!IMGBB_API_KEY) {
    document.getElementById('noQrBox').classList.add('show');
    return;
  }

  const btn = document.getElementById('qrBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 上傳中…';

  try {
    const base64 = resultCanvas.toDataURL('image/jpeg', 0.92).split(',')[1];

    const fd = new FormData();
    fd.append('key',        IMGBB_API_KEY);
    fd.append('image',      base64);
    fd.append('expiration', QR_EXPIRY_SEC);

    const res  = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.success) throw new Error(data.error?.message || '上傳失敗');

    const url = data.data.display_url || data.data.url;

    new QRCode(document.getElementById('qrcode'), {
      text:       url,
      width:      200,
      height:     200,
      colorDark:  '#2e7d32',
      colorLight: '#ffffff',
    });

    document.getElementById('qrBox').classList.add('show');
    qrDone = true;

    btn.textContent = '📱 QR Code（點擊顯示/隱藏）';
    btn.disabled    = false;

  } catch (err) {
    alert('QR Code 產生失敗：' + err.message);
    btn.disabled    = false;
    btn.textContent = '📱 產生 QR Code 帶回家';
  }
};

/* ════════════════════════════════════════════════
   導覽工具
   ════════════════════════════════════════════════ */
function showStep(n) {
  document.querySelectorAll('.step').forEach((el, i) =>
    el.classList.toggle('active', i + 1 === n)
  );
  // update progress dots
  [1,2,3,4].forEach(i => {
    const dot  = document.getElementById('pd' + i);
    const line = document.getElementById('pl' + i);
    dot.classList.remove('done','current');
    if (i < n) dot.classList.add('done');
    if (i === n) dot.classList.add('current');
    if (line) {
      line.classList.remove('done');
      if (i < n) line.classList.add('done');
    }
  });
}

window.startOver = function() {
  stopCamera();
  photoBlob = resultCanvas = null;
  qrDone = false;
  document.getElementById('qrcode').innerHTML = '';
  document.getElementById('qrBox').classList.remove('show');
  document.getElementById('noQrBox').classList.remove('show');
  document.getElementById('qrBtn').disabled    = false;
  document.getElementById('qrBtn').textContent = '📱 產生 QR Code 帶回家';
  document.getElementById('fileInput').value   = '';
  showStep(1);
};

// init
showStep(1);
</script>
